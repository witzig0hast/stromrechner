services:
  stromrechner:
    build: .
    container_name: stromrechner
    restart: unless-stopped
    ports:
      - "8723:8723"            # hinter einem HTTPS-Reverse-Proxy z. B. "127.0.0.1:8723:8723"
    environment:
      TZ: Europe/Berlin
      # Schlüssel für die Verschlüsselung von HA-Token und SMTP-Passwort in /data/db.json (AES-256-GCM).
      # Ohne Angabe wird beim ersten Start automatisch /data/secret.key erzeugt.
      # Empfohlen: eigenen Schlüssel setzen, dann liegt er nicht im Volume (bei Verlust sind die Geheimnisse weg).
      # SECRET_KEY: "ein-langer-zufaelliger-schluessel"
      # Optional direktes HTTPS (PEM-Dateien im Container, z. B. per Volume eingebunden):
      # TLS_CERT: /certs/fullchain.pem
      # TLS_KEY: /certs/privkey.pem
      # Optional gegen DNS-Rebinding: nur diese Hostnamen zulassen
      # ALLOWED_HOSTS: "strom.example.com,192.168.1.5"
      # Reverse-Proxy (Caddy, nginx, Traefik …) wird automatisch erkannt: X-Forwarded-* wird akzeptiert,
      # wenn die Verbindung von einer privaten/lokalen Adresse kommt. Optional: "1" = immer, "0" = nie.
      # TRUST_PROXY: "auto"
    volumes:
      - stromrechner-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
volumes:
  stromrechner-data:
